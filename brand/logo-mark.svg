<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RBUBANK mark">
  <title>RBUBANK — mark</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="220" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA24B"/>
      <stop offset="0.48" stop-color="#FF7A18"/>
      <stop offset="1" stop-color="#D8410A"/>
    </linearGradient>
    <radialGradient id="gloss" cx="130" cy="40" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.46"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect width="512" height="512" rx="114" fill="url(#gloss)"/>
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"/>

  <!-- Monogram: the same single-stroke construction as the wordmark, so the
       mark and the logotype are visibly the same alphabet. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M146 384V140h76a56 56 0 0 1 0 112h-76"/>
    <path d="M216 252l72 132"/>
  </g>

  <!-- One rising arrow in the corner the R leaves open: the whole promise of a
       bank in a single stroke, and it survives at 28px. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.94">
    <path d="M300 316 386 186"/>
    <path d="M330 168h64v62"/>
  </g>
</svg>
